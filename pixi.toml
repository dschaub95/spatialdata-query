[workspace]
name = "spatialdata-query-benchmarks"
version = "0.1.0"
description = "Benchmarks for SpatialData query operations"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.10,<3.13"
# Geospatial system libraries needed to build pyproj / geopandas from PyPI
proj = "*"
libspatialindex = "*"

[pypi-dependencies]
spatialdata-query-benchmarks = { path = ".", editable = true }
asv = "*"
py-spy = "*"
memray = "*"

[tasks]
# --- ASV benchmarks ---
# Quick sanity check (1 repeat, all benchmarks)
bench-quick = { cmd = "asv run --python=same --quick --show-stderr -v" }
# Quick check for individual suites
bench-spatial = { cmd = "asv run --python=same -b SpatialQueryBenchmark --quick --show-stderr -v" }
bench-data = { cmd = "asv run --python=same -b DataOperationsBenchmark --quick --show-stderr -v" }
# Full run (3 repeats, accurate results stored in .asv/results/)
bench-full = { cmd = "asv run --python=same --show-stderr -v" }
# Generate HTML report and open preview server
bench-report = { cmd = "asv publish && asv preview" }

# --- CPU profiling with py-spy ---
# Records a speedscope flame graph of scripts/benchmark_polygon_query.py.
# On macOS this may require: sudo pixi run profile-pyspy
# Open the result with: speedscope profile.speedscope.json
profile-pyspy = { cmd = "py-spy record --gil -o profile.speedscope.json --format speedscope -- python scripts/benchmark_polygon_query.py" }

# --- Memory profiling with memray ---
# Runs the benchmark under memray and produces an HTML flame graph.
# Output: memray-flamegraph-memray-output.html
profile-memray = { cmd = "memray run -o memray-output.bin scripts/benchmark_polygon_query.py && memray flamegraph --temporal memray-output.bin" }
